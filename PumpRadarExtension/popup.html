<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Saver</title>
    <style>
        /* 1. PAVIMENTO ASSOLUTO: Assorbe lo zoom e non lascia mai buchi neri */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #07090e; /* Un blu notte scurissimo e profondo, non nero puro */
            
            /* 🔥 LA MAGIA: Doppia luce radiale per un effetto 3D morbido */
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(0, 255, 204, 0.12) 0%, transparent 55%), /* Luce Smeraldo in alto a dx */
                radial-gradient(circle at 0% 100%, rgba(179, 102, 255, 0.08) 0%, transparent 50%); /* Luce Viola in basso a sx */
            
            background-attachment: fixed; /* Tiene ferme le luci anche se scorri giù */
            width: 100%;
            min-height: 540px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }
        

        /* 2. CONTENITORE DELL'APP */
        #master-app {
            width: 350px;
            margin: 0 auto; /* Centra l'app automaticamente se c'è spazio vuoto */
            padding: 12px;
            box-sizing: border-box;
            font-size: 15px; 
        }

        /* --- Elementi Grafici --- */
        .header-container { display: flex; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 10px; }
        .header-logo { width: 38px; height: 38px; border-radius: 50%; margin-right: 12px; border: 1px solid #333; }
        
        img {
            image-rendering: auto !important; /* 🔥 LA MAGIA: Forza l'alta definizione e spegne i pixel duri di Chrome */
            object-fit: cover;
            transform: translateZ(0); 
            backface-visibility: hidden;
        }
        
        /* 🔥 FIX AVATAR SGRANATI (PEPE): Rende la pixel-art tagliente e perfetta */
        /* 🔥 FIX DEFINITIVO AVATAR: Restituisce l'alta definizione e la morbidezza */
        #current-user-avatar, .avatar-option {
            image-rendering: auto; /* Annulla l'effetto "a scacchi" */
            -webkit-optimize-contrast: auto;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .header-title { margin: 0; font-size: 16px; font-weight: 900; letter-spacing: 1px; }
        .header-subtitle { font-size: 9px; color: #00ffcc; text-transform: uppercase; font-weight: bold; }
        #zoom-controls button { width: 26px; height: 26px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    
    <!-- GABBIA PRINCIPALE -->
    <div id="master-app">
        <!-- HEADER CON PULSANTI ZOOM (+ e -) -->
        <div class="header-container">
            <img src="meme.jpg" alt="Meme Saver" class="header-logo">
            <div style="flex-grow: 1;">
                <div class="header-title">MEME SAVER</div>
                <div class="header-subtitle">Your Trading Helper</div>
            </div>
            <!-- Controlli Zoom -->
            <div id="zoom-controls" style="display: flex; gap: 4px;">
                <button id="btn-zoom-out">-</button>
                <button id="btn-zoom-in">+</button>
            </div>
        </div>
        
        <!-- Qui è dove il JavaScript inietterà TUTTI i dati -->
        <div id="content">
            <p style="text-align: center; color: #888;">Loading...</p>
        </div>
    </div>

    <!-- SCRIPT -->
    <script src="socket.io.min.js"></script> 
    <script src="content.js"></script> 
</body>
</html>
