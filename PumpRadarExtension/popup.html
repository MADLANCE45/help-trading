<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Saver</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 320px;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        
        /* 🔥 STILE PER IL NUOVO HEADER COMPATTO */
        .header-container {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .header-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            margin-right: 12px;
            box-shadow: 0 0 8px rgba(0,255,204,0.3);
            border: 1px solid #333;
        }
        .header-title {
            margin: 0;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .header-subtitle {
            font-size: 9px;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        .token-mint {
            font-size: 0.75em;
            color: #aaaaaa;
            margin-bottom: 15px;
            word-break: break-all;
        }
        .danger { color: #ff4444; font-weight: bold; }
        .safe { color: #00cc66; font-weight: bold; }
        .score { font-size: 1.2em; }
    </style>
</head>
<body>

    <!-- 🔥 NUOVO HEADER CON LOGO PICCOLO E TESTO -->
    <div class="header-container">
        <img src="meme.jpg" alt="Meme Saver" class="header-logo">
        <div>
            <div class="header-title">MEME SAVER</div>
            <div class="header-subtitle">Your Trading Helper</div>
        </div>
    </div>
    
    <!-- Qui è dove il JavaScript inietterà TUTTI i dati -->
    <div id="content">
        <p>Caricamento in corso...</p>
    </div>

    <!-- 🔥 INSERISCI QUESTO PRIMA DEL TUO SCRIPT -->
    <script src="socket.io.min.js"></script> 
    
    <!-- Assicurati che questo sia il nome del tuo file JavaScript! -->
    <script src="content.js"></script> 
</body>
</html>
