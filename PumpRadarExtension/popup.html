    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
        }
        h2 {
            font-size: 18px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-top: 0;

        }

        .danger { color: #ff4444; }
        .safe { color: #00C851; }
        .token-mint {
            font-size: 10px;
            color: #888;
            word-break: break-all;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h2>🕵️ Pump Radar</h2>
