# RuFlo V3 Runtime Configuration
# Generated: 2026-08-10T15:36:28.841Z

version: "3.0.0"

swarm:
  topology: hierarchical-mesh
  maxAgents: 8
  autoScale: true
  coordinationStrategy: consensus

memory:
  backend: sqlite
  enableHNSW: true
  persistPath: .claude-flow/data
  cacheSize: 100
  # ADR-049: Self-Learning Memory
  learningBridge:
    enabled: false
    sonaMode: balanced
    confidenceDecayRate: 0.005
    accessBoostAmount: 0.03
    consolidationThreshold: 10
  memoryGraph:
    enabled: false
    pageRankDamping: 0.85
    maxNodes: 5000
    similarityThreshold: 0.8
  agentScopes:
    enabled: false
    defaultScope: project

neural:
  enabled: true
  modelPath: .claude-flow/neural

hooks:
  enabled: true
  autoExecute: true

mcp:
  autoStart: false
  port: 3000
